plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.guidelens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.guidelens.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            // minification stays OFF until the keep-rules above are validated
            // on a signed release build. Do not flip this blindly — TFLite +
            // ML Kit need real-device verification.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // Memory-mapped via assets.openFd() + FileChannel.map() — the models
    // MUST stay uncompressed inside the APK.
    androidResources {
        noCompress 'tflite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'   // bundled OCR model -> fully offline
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ---- unit tests (JVM, no device needed) ----
    testImplementation 'junit:junit:4.13.2'
}

// ---- ML models ----
// Both models are COMMITTED at app/src/main/assets/*.tflite, so builds are
// deterministic and work offline. This task only downloads a model if the
// committed file is missing or invalid (e.g. after a bad checkout).
tasks.register('downloadModels') {
    def assetsDir = layout.projectDirectory.dir('src/main/assets')
    outputs.dir assetsDir

    doLast {
        assetsDir.asFile.mkdirs()
        def det = new File(assetsDir.asFile, 'detect.tflite')

        // fast path: already present (committed or pre-downloaded)
        if (det.isFile() && det.length() > 1000000L && hasTflMagic(det)) {
            println "Using detect.tflite (${det.length()} bytes)"
        } else {
            if (det.exists()) det.delete()
            def urls = [
                'https://github.com/am15h/object_detection_flutter/raw/master/assets/detect.tflite',
                'https://raw.githubusercontent.com/am15h/object_detection_flutter/master/assets/detect.tflite'
            ]
            for (u in urls) {
                try {
                    def tmp = new File(assetsDir.asFile, 'detect.tflite.part')
                    new URL(u).withInputStream { i -> tmp.withOutputStream { o ->
                        byte[] buf = new byte[65536]; int r
                        while ((r = i.read(buf)) != -1) o.write(buf, 0, r)
                    } }
                    if (tmp.length() > 1000000L && hasTflMagic(tmp)) {
                        tmp.renameTo(det)
                        println "Downloaded detect.tflite (${det.length()} bytes) from $u"
                        break
                    }
                    println "Rejected download from $u (not a valid TFLite file)"
                    tmp.delete()
                } catch (Exception ex) {
                    println "Download failed from $u: ${ex.message}"
                }
            }
        }

        if (!det.isFile() || !hasTflMagic(det)) {
            throw new GradleException(
                'Missing object-detection model app/src/main/assets/detect.tflite.\n' +
                'Fix: download from https://github.com/am15h/object_detection_flutter/raw/master/assets/detect.tflite\n' +
                '     and commit it as app/src/main/assets/detect.tflite')
        }

        // optional segmentation model (never fails the build)
        def seg = new File(assetsDir.asFile, 'deeplab_cityscapes.tflite')
        if (!seg.isFile() || !hasTflMagic(seg)) {
            if (seg.exists()) seg.delete()
            def segUrls = [
                'https://raw.githubusercontent.com/google-coral/edgetpu/master/test_data/deeplabv3_mnv2_cityscapes_quant.tflite',
                'https://tfhub.dev/tensorflow/lite-model/deeplabv3/1/metadata/2?lite-format=tflite'
            ]
            for (u in segUrls) {
                try {
                    def tmp = new File(assetsDir.asFile, 'deeplab.part')
                    new URL(u).withInputStream { i -> tmp.withOutputStream { o ->
                        byte[] buf = new byte[65536]; int r
                        while ((r = i.read(buf)) != -1) o.write(buf, 0, r)
                    } }
                    if (tmp.length() > 1000000L && hasTflMagic(tmp)) {
                        tmp.renameTo(seg)
                        println "Downloaded segmentation model (${seg.length()} bytes) from $u"
                        break
                    }
                    tmp.delete()
                } catch (ignored) { }
            }
            if (!seg.isFile()) println 'WARNING: segmentation model unavailable (optional) - pole/wall zones disabled, object detection still works.'
        }
    }
}

// real .tflite files start with the flatbuffer magic "TFL3"
ext.hasTflMagic = { File f ->
    if (f == null || !f.isFile() || f.length() < 8) return false
    def fis = new java.io.FileInputStream(f)
    try {
        byte[] skip = new byte[4]
        byte[] m = new byte[4]
        // flatbuffer layout: [u32 root offset][4-byte file id] - 'TFL3' is at bytes 4-7
        if (fis.read(skip) != 4) return false
        return fis.read(m) == 4 && m[0] == 0x54 && m[1] == 0x46 && m[2] == 0x4C && m[3] == 0x33
    } finally {
        fis.close()
    }
}

preBuild.dependsOn 'downloadModels'
